<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Racing Game</title>
    <link rel="stylesheet" href="css/game.css">
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <!-- In-Game HUD & Overlay -->
    <div id="ui-layer">
        <div class="hud">
            <div class="score-box" id="score-display">SCORE: 0</div>
            <div class="top-score-box" id="high-score-display">BEST: 0</div>
        </div>
        <div class="controls-hint" id="control-text">W A S D or Arrows to Steer</div>
    </div>

    <!-- Start / Game Over Screen -->
    <div id="start-screen">
        <h1 id="title-text">NEON RACING</h1>
        <p id="subtitle-text">Click to Start Engine</p>
    </div>

    <!-- Mobile Virtual Joystick -->
    <div id="joystick-zone">
        <div id="joystick-knob"></div>
    </div>

    <!-- 3D Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Modular Game Scripts -->
    <script src="js/game/config.js"></script>
    <script src="js/game/audio.js"></script>
    <script src="js/game/input.js"></script>
    <script src="js/game/player.js"></script>
    <script src="js/game/obstacles.js"></script>
    <script src="js/game/collision.js"></script>
    <script src="js/game/game.js"></script>
</body>
</html>
